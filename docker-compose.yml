networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-s1n2-gw
    ipam:
      config:
        - subnet: 172.24.0.0/16
          gateway: 172.24.0.1
    name: br-s1n2-gw

  # Dedicated N6-side "data network" for UE ping/iperf targets.
  # Keep it internal so traffic must traverse UPF.
  n6:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.25.0.0/24
    name: br-s1n2-gw-n6

volumes:
  mongodbdata:
    name: docker_s1n2_mongodbdata
