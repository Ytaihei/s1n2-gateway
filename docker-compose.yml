  #   networks:
  #     default:
  #       ipv4_address: ${SRS_ENB_IP}

  # srsue_zmq:
  #   build:
  #     context: ..
  #     dockerfile: ran/srslte/Dockerfile
  #   depends_on:
  #     - srsenb_zmq
  #   container_name: srsue_zmq-s1n2
